name: Sync to Astro

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Obsidian repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Astro repo
        run: |
          git clone https://x-access-token:${{ secrets.ASTRO_DEPLOY_TOKEN }}@github.com/ShallowDr1Am/myPoint.git astro-repo

      - name: Sync markdown files
        run: |
          # Remove all existing md files in Astro's pages directory
          rm -f astro-repo/src/pages/*.md

          # Copy md files from Obsidian (exclude Excalidraw)
          for f in *.md; do
            [ -f "$f" ] && cp "$f" astro-repo/src/pages/
          done

          # Also copy files in subdirectories (excluding Excalidraw)
          find . -name "*.md" -not -path "./Excalidraw/*" -exec sh -c '[ -f "{}" ] && cp "{}" astro-repo/src/pages/' \;

      - name: Commit and push to Astro repo
        run: |
          cd astro-repo
          git add .
          git diff --quiet HEAD || git commit -m "chore: sync from Obsidian $(date '+%Y-%m-%d %H:%M:%S')"
          git push https://x-access-token:${{ secrets.ASTRO_DEPLOY_TOKEN }}@github.com/ShallowDr1Am/myPoint.git HEAD:main
