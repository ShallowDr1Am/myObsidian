name: Sync to Astro

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Obsidian repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Astro repo
        run: |
          git clone https://x-access-token:${{ secrets.ASTRO_DEPLOY_TOKEN }}@github.com/ShallowDr1Am/myPoint.git astro-repo

      - name: Sync markdown files and images
        run: |
          # Remove existing md and image files in Astro's content directory
          rm -f astro-repo/src/content/notes/*.md
          rm -f astro-repo/src/content/notes/*.gif astro-repo/src/content/notes/*.png astro-repo/src/content/notes/*.jpg astro-repo/src/content/notes/*.webp astro-repo/src/content/notes/*.svg

          # Copy md files from Obsidian (exclude Excalidraw)
          for f in *.md; do
            [ -f "$f" ] && cp "$f" astro-repo/src/content/notes/
          done

          # Copy image files from Obsidian root
          for ext in gif png jpg jpeg webp svg; do
            for f in *."$ext"; do
              [ -f "$f" ] && cp "$f" astro-repo/src/content/notes/
            done
          done

          # Also copy files in subdirectories (excluding Excalidraw and hidden dirs)
          find . -type f \( -name "*.md" -o -name "*.gif" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" -o -name "*.svg" \) -not -path "./.git/*" -not -path "./.obsidian/*" -not -path "./Excalidraw/*" -exec cp "{}" astro-repo/src/content/notes/ \;

      - name: Commit and push to Astro repo
        run: |
          cd astro-repo
          git add .
          git diff --quiet HEAD || git commit -m "chore: sync from Obsidian $(date '+%Y-%m-%d %H:%M:%S')"
          git push https://x-access-token:${{ secrets.ASTRO_DEPLOY_TOKEN }}@github.com/ShallowDr1Am/myPoint.git HEAD:main
